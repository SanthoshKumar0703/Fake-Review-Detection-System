{% extends "base.html" %}
{% block title %}Reset password — Verdict{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <span class="eyebrow">Account Recovery</span>
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" autofocus>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Reset password</button>
    </form>

    <p class="auth-foot"><a href="{{ url_for('login') }}">Back to sign in</a></p>
  </div>
</section>
{% endblock %}
